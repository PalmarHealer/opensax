services:
  lernsax-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: lernsax-web
    environment:
      NODE_ENV: production
      PORT: "3000"
      LERNSAX_WEB_SESSION_KEY: ${LERNSAX_WEB_SESSION_KEY:-7d62e85be76e3610578aba9a2003e885921adcc03646fb0e}
      ORIGIN: ${WEB_ORIGIN:-http://localhost:3001}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-936670e94645ed8a6abd0fb83ed3caa521e1413774b7df86}
      ONLYOFFICE_PUBLIC_URL: ${ONLYOFFICE_PUBLIC_URL:-http://localhost:3380}
      WEB_INTERNAL_URL: ${WEB_INTERNAL_URL:-http://lernsax-web:3000}
      OO_INTERNAL_HOST: ${OO_INTERNAL_HOST:-lernsax-onlyoffice}
    ports:
      # Bind to all interfaces by default so a private/VPN IP and 127.0.0.1
      # are both reachable. Override with BIND_HOST in `.env` to lock down.
      - "${BIND_HOST:-0.0.0.0}:3001:3000"
      # …and on IPv6 loopback as well. Windows resolves "localhost" to ::1
      # first, and without this every browser request burns a failed IPv6
      # connect before falling back to IPv4 — ~200ms of dead time each.
      - "[::1]:3001:3000"
    volumes:
      - lernsax-web-data:/app/data

  lernsax-mcp:
    build:
      context: .
      dockerfile: packages/mcp/Dockerfile
    container_name: lernsax-mcp
    environment:
      NODE_ENV: production
      LERNSAX_MCP_TRANSPORT: streamable-http
      LERNSAX_MCP_HTTP_HOST: 0.0.0.0
      LERNSAX_MCP_HTTP_PORT: "8765"
      LERNSAX_MCP_HTTP_PATH: "/mcp"
      LERNSAX_MCP_IDLE_TTL_MS: "300000"
      # Same data volume + key as the web app so the MCP server can resolve
      # OAuth bearer tokens to user credentials.
      LERNSAX_DATA_DIR: /app/data
      LERNSAX_WEB_SESSION_KEY: ${LERNSAX_WEB_SESSION_KEY:-7d62e85be76e3610578aba9a2003e885921adcc03646fb0e}
      # Same external origin as the SvelteKit app — the MCP uses it to build
      # the WWW-Authenticate `resource_metadata` URL on 401 responses.
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3001}
    volumes:
      - lernsax-web-data:/app/data
    ports:
      - "${BIND_HOST:-0.0.0.0}:8765:8765"

  onlyoffice:
    # Euro-Office (https://github.com/Euro-Office/DocumentServer) is a fork
    # but their `:latest` ships a broken supervisord config; sticking with the
    # upstream OnlyOffice image until they tag a stable build.
    image: onlyoffice/documentserver:8.2
    container_name: lernsax-onlyoffice
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-936670e94645ed8a6abd0fb83ed3caa521e1413774b7df86}
      JWT_HEADER: "Authorization"
      JWT_IN_BODY: "true"
      USE_UNAUTHORIZED_STORAGE: "true"
    ports:
      - "${BIND_HOST:-0.0.0.0}:3380:80"
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-logs:/var/log/onlyoffice
      - onlyoffice-cache:/var/lib/onlyoffice/documentserver/App_Data/cache/files

volumes:
  lernsax-web-data:
  onlyoffice-data:
  onlyoffice-logs:
  onlyoffice-cache:
