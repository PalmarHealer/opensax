services:
  lernsax-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: lernsax-web
    environment:
      NODE_ENV: production
      PORT: "3000"
      LERNSAX_WEB_SESSION_KEY: ${LERNSAX_WEB_SESSION_KEY:-7d62e85be76e3610578aba9a2003e885921adcc03646fb0e}
      ORIGIN: ${WEB_ORIGIN:-http://localhost:3001}
      OPENSAX_OAUTH_CLIENTS: ${OPENSAX_OAUTH_CLIENTS:-}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-936670e94645ed8a6abd0fb83ed3caa521e1413774b7df86}
      ONLYOFFICE_PUBLIC_URL: ${ONLYOFFICE_PUBLIC_URL:-http://localhost:3380}
      WEB_INTERNAL_URL: ${WEB_INTERNAL_URL:-http://lernsax-web:3000}
      OO_INTERNAL_HOST: ${OO_INTERNAL_HOST:-lernsax-onlyoffice}
      # The REST API (/api/v1) is served by the MCP container; the web app
      # forwards it there and reads the tool catalog from it.
      LERNSAX_MCP_INTERNAL_URL: ${LERNSAX_MCP_INTERNAL_URL:-http://lernsax-mcp:8765}
      # Proxies in front of this container that append to X-Forwarded-For;
      # the client IP is read that many entries from the right (0 = no proxy).
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      # Feedback wizard: reports are POSTed here (e.g. an n8n webhook). Unset
      # = they are stored under /app/data/feedback instead.
      FEEDBACK_WEBHOOK_URL: ${FEEDBACK_WEBHOOK_URL:-}
      FEEDBACK_WEBHOOK_SECRET: ${FEEDBACK_WEBHOOK_SECRET:-}
    ports:
      # Bind to all interfaces by default so a private/VPN IP and 127.0.0.1
      # are both reachable. Override with BIND_HOST in `.env` to lock down.
      - "${BIND_HOST:-0.0.0.0}:3001:3000"
      # …and on IPv6 loopback as well. Windows resolves "localhost" to ::1
      # first, and without this every browser request burns a failed IPv6
      # connect before falling back to IPv4 — ~200ms of dead time each.
      - "[::1]:3001:3000"
    volumes:
      - lernsax-web-data:/app/data

  lernsax-mcp:
    build:
      context: .
      dockerfile: packages/mcp/Dockerfile
    container_name: lernsax-mcp
    environment:
      NODE_ENV: production
      LERNSAX_MCP_TRANSPORT: streamable-http
      LERNSAX_MCP_HTTP_HOST: 0.0.0.0
      LERNSAX_MCP_HTTP_PORT: "8765"
      LERNSAX_MCP_HTTP_PATH: "/mcp"
      LERNSAX_MCP_IDLE_TTL_MS: "300000"
      # Same value as the web app. Calls the web app forwards to /api/v1 carry
      # its signed client IP instead (shared LERNSAX_WEB_SESSION_KEY).
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      # Same data volume + key as the web app so the MCP server can resolve
      # OAuth bearer tokens to user credentials.
      LERNSAX_DATA_DIR: /app/data
      LERNSAX_WEB_SESSION_KEY: ${LERNSAX_WEB_SESSION_KEY:-7d62e85be76e3610578aba9a2003e885921adcc03646fb0e}
      # Same external origin as the SvelteKit app — the MCP uses it to build
      # the WWW-Authenticate `resource_metadata` URL on 401 responses.
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3001}
    volumes:
      - lernsax-web-data:/app/data
    ports:
      - "${BIND_HOST:-0.0.0.0}:8765:8765"

  onlyoffice:
    # Euro-Office (https://github.com/Euro-Office/DocumentServer), the European
    # fork of OnlyOffice: same editor API (api.js, DocsAPI, JWT env vars), but
    # everything lives under euro-office paths instead of onlyoffice ones.
    # Service and container keep their old names so OO_INTERNAL_HOST and the
    # reverse proxy's upstream (lernsax-onlyoffice:80) still match. Pinned to a
    # release tag — `latest` tracks main.
    image: ghcr.io/euro-office/documentserver:${EUROOFFICE_TAG:-v9.3.4-hotfix.1}
    container_name: lernsax-onlyoffice
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-936670e94645ed8a6abd0fb83ed3caa521e1413774b7df86}
      JWT_HEADER: "Authorization"
      JWT_IN_BODY: "true"
      USE_UNAUTHORIZED_STORAGE: "true"
    ports:
      - "${BIND_HOST:-0.0.0.0}:3380:80"
    volumes:
      - eurooffice-data:/var/www/euro-office/Data
      - eurooffice-logs:/var/log/euro-office
      - eurooffice-cache:/var/lib/euro-office/documentserver/App_Data/cache/files

volumes:
  lernsax-web-data:
  eurooffice-data:
  eurooffice-logs:
  eurooffice-cache:
