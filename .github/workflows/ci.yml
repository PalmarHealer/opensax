name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Version is pinned in package.json's `packageManager` field, so the
      # action picks it up automatically — passing `version` here would
      # double-specify and crash with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter "./packages/*" build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test MCP / REST API
        run: pnpm --filter @lernsax/mcp test

      - name: Build web app
        run: pnpm --filter @lernsax/web build

      - name: Verify no committed secrets
        # Tripwire — fails CI if a real-looking secret slips into a tracked file.
        run: |
          set -e
          if git grep -nE "BEGIN (RSA|OPENSSH|EC|DSA|PGP) PRIVATE KEY" -- ':(exclude).github/**' ; then
            echo "::error::Private key material found in tracked files"; exit 1
          fi
          if git grep -nE "(sk_live_|xoxb-|xoxp-|ghp_|gho_|ghs_|ghu_)[A-Za-z0-9]{10,}" -- ':(exclude).github/**' ; then
            echo "::error::Vendor token detected in tracked files"; exit 1
          fi

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: build
    # PRs only prove the Dockerfiles build; pushes to main also publish the
    # images to GHCR, which is what the deployment pulls.
    permissions:
      contents: read
      packages: write

    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the owner (GHCR rejects uppercase) and adds
      # the org.opencontainers.image.source label that links the package to
      # this repo.
      - name: Web image metadata
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/opensax-web
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: MCP image metadata
        id: meta-mcp
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/opensax-mcp
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build mcp image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/mcp/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta-mcp.outputs.tags }}
          labels: ${{ steps.meta-mcp.outputs.labels }}
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,scope=mcp,mode=max

      # Optional: tell Portainer to pull the fresh images and recreate the
      # stack. Without the secret the images are just published and the
      # stack picks them up on the next manual "Pull and redeploy".
      - name: Trigger Portainer redeploy
        if: env.PUBLISH == 'true'
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$PORTAINER_WEBHOOK_URL" ]; then
            echo "::notice::PORTAINER_WEBHOOK_URL not set — skipping redeploy"
            exit 0
          fi
          curl -fsS -X POST "$PORTAINER_WEBHOOK_URL"
