name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Version is pinned in package.json's `packageManager` field, so the
      # action picks it up automatically — passing `version` here would
      # double-specify and crash with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter "./packages/*" build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build web app
        run: pnpm --filter @lernsax/web build

      - name: Verify no committed secrets
        # Tripwire — fails CI if a real-looking secret slips into a tracked file.
        run: |
          set -e
          if git grep -nE "BEGIN (RSA|OPENSSH|EC|DSA|PGP) PRIVATE KEY" -- ':(exclude).github/**' ; then
            echo "::error::Private key material found in tracked files"; exit 1
          fi
          if git grep -nE "(sk_live_|xoxb-|xoxp-|ghp_|gho_|ghs_|ghu_)[A-Za-z0-9]{10,}" -- ':(exclude).github/**' ; then
            echo "::error::Vendor token detected in tracked files"; exit 1
          fi

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build mcp image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/mcp/Dockerfile
          push: false
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,scope=mcp,mode=max

  build-on-server:
    name: Build images on server
    runs-on: ubuntu-latest
    needs: docker
    # Only on direct pushes to main (not PRs from forks). Skip if any of the
    # SSH secrets are missing — lets contributors fork without breaking CI.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check deploy secrets
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY:  ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_HOST/USER/SSH_KEY not set — skipping server build"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & prune on server
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          port:     ${{ secrets.DEPLOY_PORT || 22 }}
          # First-time build can blow past the 10-min default while pnpm/Vite
          # warm up.
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            # Refresh source. `fetch && reset` instead of `pull` so a dirty
            # working tree on the server doesn't block the build.
            git fetch --quiet origin main
            git reset --hard origin/main

            # Just build the services with local Dockerfiles. Don't touch
            # running containers — Portainer (or whoever owns the stack)
            # decides when to recreate.
            COMPOSE="${{ secrets.DEPLOY_COMPOSE_FILE || 'compose.portainer.yml' }}"
            docker compose -f "$COMPOSE" build --pull lernsax-web lernsax-mcp

            # Cleanup — drop dangling images from the previous build and trim
            # the builder cache. Conservative: only `--filter dangling=true`,
            # never `-a`, so still-tagged images of other stacks stay put.
            docker image prune -f --filter dangling=true
            docker builder prune -f --keep-storage 2GB || true
