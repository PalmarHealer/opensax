services:
  lernsax-web:
    # Built and pushed by CI on every push to main. Pin OPENSAX_TAG to a
    # sha-<commit> tag to roll back.
    image: ghcr.io/palmarhealer/opensax-web:${OPENSAX_TAG:-latest}
    container_name: lernsax-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      LERNSAX_WEB_SESSION_KEY: ${LERNSAX_WEB_SESSION_KEY:?set a 32+ char secret}
      ORIGIN: ${WEB_ORIGIN:?set the public web URL, e.g. https://app.example.com}
      OPENSAX_OAUTH_CLIENTS: ${OPENSAX_OAUTH_CLIENTS:-}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?set a long secret}
      # Public URL the user's browser uses to load OnlyOffice's api.js
      ONLYOFFICE_PUBLIC_URL: ${ONLYOFFICE_PUBLIC_URL:?set the public OnlyOffice URL}
      # Docker-internal URL the DocumentServer uses to call our content/callback endpoints
      WEB_INTERNAL_URL: ${WEB_INTERNAL_URL:-http://lernsax-web:3000}
      OO_INTERNAL_HOST: ${OO_INTERNAL_HOST:-lernsax-onlyoffice}
      # The REST API (/api/v1) is served by the MCP container; the web app
      # forwards it there and reads the tool catalog from it.
      LERNSAX_MCP_INTERNAL_URL: ${LERNSAX_MCP_INTERNAL_URL:-http://lernsax-mcp:8765}
      # Proxies in front of this container that append to X-Forwarded-For;
      # the client IP is read that many entries from the right (0 = no proxy).
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      # Relay all LernSax-bound traffic (JSON-RPC, WebDAV, OnlyOffice login)
      # through a German egress proxy so LernSax sees a DE IP. Leave unset to
      # talk to LernSax directly from the deployment.
      LERNSAX_PROXY_URL: ${LERNSAX_PROXY_URL:-}
      # Feedback wizard: reports are POSTed here (e.g. an n8n webhook). Unset
      # = they are stored under /app/data/feedback instead.
      FEEDBACK_WEBHOOK_URL: ${FEEDBACK_WEBHOOK_URL:-}
      FEEDBACK_WEBHOOK_SECRET: ${FEEDBACK_WEBHOOK_SECRET:-}
    ports:
      # Bind to BIND_HOST so only the reverse proxy on the same network can
      # reach us. Defaults to all interfaces — set BIND_HOST in .env to lock
      # this down (e.g. a private/VPN IP).
      - "${BIND_HOST:-0.0.0.0}:3001:3000"
    volumes:
      - lernsax-web-data:/app/data

  lernsax-mcp:
    image: ghcr.io/palmarhealer/opensax-mcp:${OPENSAX_TAG:-latest}
    container_name: lernsax-mcp
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LERNSAX_MCP_TRANSPORT: streamable-http
      LERNSAX_MCP_HTTP_HOST: 0.0.0.0
      LERNSAX_MCP_HTTP_PORT: "8765"
      LERNSAX_MCP_HTTP_PATH: "/mcp"
      LERNSAX_MCP_IDLE_TTL_MS: "300000"
      # Same value as the web app. Calls the web app forwards to /api/v1 carry
      # its signed client IP instead (shared LERNSAX_WEB_SESSION_KEY).
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      LERNSAX_DATA_DIR: /app/data
      LERNSAX_WEB_SESSION_KEY: ${LERNSAX_WEB_SESSION_KEY:?set a 32+ char secret}
      # Used to build the WWW-Authenticate resource_metadata URL on 401s.
      WEB_ORIGIN: ${WEB_ORIGIN:?set the public web URL}
      # Relay LernSax-bound traffic through a German egress proxy (see web service).
      LERNSAX_PROXY_URL: ${LERNSAX_PROXY_URL:-}
    ports:
      - "${BIND_HOST:-0.0.0.0}:8765:8765"
    volumes:
      - lernsax-web-data:/app/data

  onlyoffice:
    image: onlyoffice/documentserver:8.2
    container_name: lernsax-onlyoffice
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?set a long secret}
      JWT_HEADER: "Authorization"
      JWT_IN_BODY: "true"
      USE_UNAUTHORIZED_STORAGE: "true"
    ports:
      - "${BIND_HOST:-0.0.0.0}:3380:80"
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-logs:/var/log/onlyoffice
      - onlyoffice-cache:/var/lib/onlyoffice/documentserver/App_Data/cache/files

volumes:
  lernsax-web-data:
  onlyoffice-data:
  onlyoffice-logs:
  onlyoffice-cache:
