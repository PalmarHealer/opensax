# tinyproxy config for the German LernSax egress relay.
#
# Runs on a German Tailscale node. The Vienna deployment points
# LERNSAX_PROXY_URL at this proxy (over Tailscale), so LernSax sees this
# node's public IP instead of the Vienna one.
#
# Install:  apt-get install -y tinyproxy
# Then replace /etc/tinyproxy/tinyproxy.conf with this file and:
#   systemctl restart tinyproxy

User tinyproxy
Group tinyproxy

# Listen ONLY on the Tailscale interface. Replace with this node's 100.x.y.z
# Tailscale IP (from `tailscale ip -4`). Never bind to 0.0.0.0 — that would
# expose an open proxy to the public internet.
Listen 100.64.0.1
Port 8888

Timeout 600

# Tailscale already authenticates and encrypts the hop, and we bind to the
# tailnet interface only, so the tailnet is our trust boundary. Restrict to the
# Vienna node's Tailscale IP for defense in depth (replace 100.64.0.2).
Allow 100.64.0.2

# Only allow CONNECT to LernSax over 443 — this proxy is not a general-purpose
# proxy. (CONNECT is required because LernSax is HTTPS; the proxy tunnels the
# TLS without terminating it.)
ConnectPort 443
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes

# Don't leak that requests came via a proxy.
DisableViaHeader Yes

LogLevel Info
PidFile "/run/tinyproxy/tinyproxy.pid"
MaxClients 100
